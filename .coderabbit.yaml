# CodeRabbit 配置文件
# 文档：https://docs.coderabbit.ai/getting-started/configure-coderabbit

language: "zh-CN"

reviews:
  # 每次 push 都审查，不只看 PR
  auto_review:
    enabled: true
    drafts: false

  # 审查重点
  profile: "assertive"          # assertive = 更严格，会指出潜在问题
  request_changes_workflow: false

  # 要求写什么
  poem: false                   # 不需要每次写诗
  collapse_walkthrough: false
  sequence_diagrams: true       # 生成序列图帮助理解代码流

  # 路径过滤（不审查这些文件）
  path_filters:
    - "!**/*.md"                # 不审查 markdown 文档
    - "!**/templates/**"        # 不审查模板文件

  # 每个 hunk 的审查粒度
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"

chat:
  # 支持在评论里 @coderabbitai 追问
  auto_reply: true
